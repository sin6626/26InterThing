<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MQTT 测试发包工具</title>
    <style>
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --card-border: #30363d;
        --text: #c9d1d9;
        --text-heading: #f0f6fc;
        --accent: #238636;
        --accent-hover: #2ea043;
        --danger: #da3633;
        --danger-hover: #b62324;
        --blue: #1f6feb;
        --blue-hover: #388bfd;
        --muted: #8b949e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        padding: 24px 16px;
        display: flex;
        justify-content: center;
      }
      .container {
        width: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 8px;
      }
      .header h1 { font-size: 18px; color: var(--text-heading); }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
        background: #21262d;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; }
      .online { color: #3fb950; }
      .online .dot { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
      .offline { color: #f85149; }
      .offline .dot { background: #f85149; }

      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-heading);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form-group label {
        font-size: 12px;
        color: var(--muted);
      }
      input, textarea {
        background: #0d1117;
        border: 1px solid var(--card-border);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus, textarea:focus { border-color: #58a6ff; }
      textarea {
        font-family: Consolas, Monaco, "Courier New", monospace;
        min-height: 120px;
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: 0.15s ease;
        color: #fff;
      }
      .btn-blue { background: var(--blue); }
      .btn-blue:hover { background: var(--blue-hover); }
      .btn-green { background: var(--accent); }
      .btn-green:hover { background: var(--accent-hover); }
      .btn-danger { background: var(--danger); }
      .btn-danger:hover { background: var(--danger-hover); }
      .btn-secondary {
        background: #21262d;
        border: 1px solid var(--card-border);
        color: var(--text);
      }
      .btn-secondary:hover { background: #30363d; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .auto-panel {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        background: #10141b;
        border: 1px solid var(--card-border);
        border-radius: 6px;
        flex-wrap: wrap;
      }
      .auto-info {
        font-size: 12px;
        color: var(--muted);
        margin-left: auto;
      }

      .log-box {
        background: #0d1117;
        border: 1px solid var(--card-border);
        border-radius: 6px;
        height: 220px;
        overflow-y: auto;
        padding: 8px;
        font-family: Consolas, monospace;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .log-item {
        display: flex;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 4px;
        border-bottom: 1px solid #1c2128;
      }
      .log-time { color: var(--muted); }
      .log-tag { font-weight: bold; }
      .log-success { color: #3fb950; }
      .log-fail { color: #f85149; }
      .log-topic { color: #58a6ff; }
      .log-body {
        color: #8b949e;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }

      .broker-config {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 8px;
      }
      .collapsible { display: none; }
      .collapsible.show { display: grid; }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 顶部 Header -->
      <div class="header">
        <div>
          <h1>MQTT 测试发包工具</h1>
        </div>
        <div style="display:flex; align-items:center; gap: 10px;">
          <div id="statusBadge" class="status-badge offline">
            <span class="dot"></span>
            <span id="statusText">连接中...</span>
          </div>
          <button id="toggleConfigBtn" class="btn btn-secondary" style="padding: 4px 10px; font-size: 12px;">Broker 设置</button>
        </div>
      </div>

      <!-- Broker 配置（可折叠） -->
      <div id="configDrawer" class="card collapsible">
        <div class="card-title">Broker 连接配置</div>
        <div class="broker-config">
          <div class="form-group">
            <label>Host</label>
            <input id="cfgHost" value="localhost" />
          </div>
          <div class="form-group">
            <label>Port</label>
            <input id="cfgPort" type="number" value="1883" />
          </div>
          <div class="form-group">
            <label>Username</label>
            <input id="cfgUser" value="sin" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input id="cfgPass" type="password" value="1234" />
          </div>
          <div class="form-group">
            <label>Client ID</label>
            <input id="cfgClientId" value="mqtt_test_sender" />
          </div>
        </div>
        <div style="display:flex; justify-content: flex-end;">
          <button id="saveConfigBtn" class="btn btn-secondary">保存并重连</button>
        </div>
      </div>

      <!-- 核心发送卡片 -->
      <div class="card">
        <div class="form-group">
          <label>目标主题 (Topic)</label>
          <input id="topicInput" value="device/sensor" placeholder="请输入 MQTT 主题，例如 device/sensor" />
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content: space-between; align-items: center;">
            <label>发送数据 (Payload / JSON / 文本)</label>
            <button id="formatBtn" class="btn btn-secondary" style="padding: 2px 8px; font-size: 11px;">格式化 JSON</button>
          </div>
          <textarea id="payloadInput" placeholder="输入要发送的数据 (支持字符串或 JSON)">{
  "d_no": "202111",
  "temp_out": 28.5,
  "flow_rate": 0.8
}</textarea>
        </div>

        <div class="row">
          <button id="sendBtn" class="btn btn-blue" style="min-width: 120px;">立即发送</button>
        </div>

        <!-- 自动发送控制 -->
        <div class="auto-panel">
          <span style="font-size: 13px; font-weight: 500;">后台自动发送：</span>
          <div class="row" style="gap: 6px;">
            <label style="font-size: 12px; color: var(--muted);">间隔(ms):</label>
            <input id="intervalInput" type="number" value="1000" min="100" style="width: 90px; padding: 4px 8px;" />
          </div>
          <button id="autoToggleBtn" class="btn btn-green">开启自动发送</button>
          <div id="autoStatus" class="auto-info">未运行</div>
        </div>
      </div>

      <!-- 发送记录与日志 -->
      <div class="card">
        <div class="card-title">
          <span>发送日志</span>
          <button id="clearLogBtn" class="btn btn-secondary" style="padding: 2px 8px; font-size: 11px;">清空日志</button>
        </div>
        <div id="logBox" class="log-box"></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id)

      let isAutoRunning = false

      // 切换 Broker 配置显示
      $('toggleConfigBtn').onclick = () => {
        $('configDrawer').classList.toggle('show')
      }

      // 格式化 JSON
      $('formatBtn').onclick = () => {
        try {
          const obj = JSON.parse($('payloadInput').value)
          $('payloadInput').value = JSON.stringify(obj, null, 2)
        } catch (e) {
          alert('数据不是有效 JSON 格式')
        }
      }

      // 获取 Payload 内容
      const getPayloadData = () => {
        const raw = $('payloadInput').value.trim()
        try {
          return JSON.parse(raw)
        } catch {
          return raw
        }
      }

      // 单次发送
      $('sendBtn').onclick = async () => {
        const topic = $('topicInput').value.trim()
        if (!topic) return alert('请输入目标主题')
        const payload = getPayloadData()

        try {
          $('sendBtn').disabled = true
          const res = await fetch('/api/publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ topic, payload }),
          })
          const data = await res.json()
          if (data.status !== 0) alert('发送失败: ' + data.message)
        } catch (err) {
          alert('请求出错: ' + err.message)
        } finally {
          $('sendBtn').disabled = false
          fetchStatus()
        }
      }

      // 启动 / 停止后台自动发送
      $('autoToggleBtn').onclick = async () => {
        if (!isAutoRunning) {
          const topic = $('topicInput').value.trim()
          if (!topic) return alert('请输入目标主题')
          const payload = getPayloadData()
          const intervalMs = Number($('intervalInput').value) || 1000

          try {
            const res = await fetch('/api/auto/start', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ topic, payload, intervalMs }),
            })
            const data = await res.json()
            if (data.status === 0) {
              isAutoRunning = true
              updateAutoUi(true)
            } else {
              alert('开启自动发送失败: ' + data.message)
            }
          } catch (e) {
            alert('网络请求出错: ' + e.message)
          }
        } else {
          try {
            const res = await fetch('/api/auto/stop', { method: 'POST' })
            const data = await res.json()
            if (data.status === 0) {
              isAutoRunning = false
              updateAutoUi(false)
            }
          } catch (e) {
            alert('停止失败: ' + e.message)
          }
        }
        fetchStatus()
      }

      const updateAutoUi = (running, count = 0, topic = '') => {
        isAutoRunning = running
        if (running) {
          $('autoToggleBtn').textContent = '停止自动发送'
          $('autoToggleBtn').className = 'btn btn-danger'
          $('autoStatus').textContent = `运行中 (已发: ${count} 次, 主题: ${topic || $('topicInput').value})`
          $('autoStatus').style.color = '#3fb950'
        } else {
          $('autoToggleBtn').textContent = '开启自动发送'
          $('autoToggleBtn').className = 'btn btn-green'
          $('autoStatus').textContent = '已停止'
          $('autoStatus').style.color = 'var(--muted)'
        }
      }

      // 保存 Broker 配置
      $('saveConfigBtn').onclick = async () => {
        const body = {
          host: $('cfgHost').value.trim(),
          port: Number($('cfgPort').value),
          username: $('cfgUser').value.trim(),
          password: $('cfgPass').value,
          clientId: $('cfgClientId').value.trim(),
        }
        try {
          const res = await fetch('/api/mqtt/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          })
          const data = await res.json()
          if (data.status === 0) {
            alert('Broker 配置已更新并触发重连')
            $('configDrawer').classList.remove('show')
          }
        } catch (e) {
          alert('保存失败: ' + e.message)
        }
      }

      // 清空日志
      $('clearLogBtn').onclick = async () => {
        await fetch('/api/logs/clear', { method: 'POST' })
        $('logBox').innerHTML = ''
      }

      // 渲染日志
      const renderLogs = (logs = []) => {
        if (!logs || !logs.length) {
          $('logBox').innerHTML = '<div style="color:var(--muted); text-align:center; padding: 20px;">暂无发送日志</div>'
          return
        }
        $('logBox').innerHTML = logs.map(l => `
          <div class="log-item">
            <span class="log-time">${l.time}</span>
            <span class="log-tag ${l.success ? 'log-success' : 'log-fail'}">[${l.type}${l.success ? '成功' : '失败'}]</span>
            <span class="log-topic">${l.topic}</span>
            <span class="log-body" title="${l.content.replace(/"/g, '&quot;')}">${l.content}</span>
          </div>
        `).join('')
      }

      // 状态拉取轮询
      const fetchStatus = async () => {
        try {
          const res = await fetch('/api/status')
          const resData = await res.json()
          if (resData.status === 0 && resData.data) {
            const { connected, autoPublish, logs, options } = resData.data
            // 更新连接状态
            const badge = $('statusBadge')
            const text = $('statusText')
            if (connected) {
              badge.className = 'status-badge online'
              text.textContent = `已连接 (${options?.host}:${options?.port})`
            } else {
              badge.className = 'status-badge offline'
              text.textContent = '未连接'
            }

            // 更新自动发送状态
            updateAutoUi(autoPublish.running, autoPublish.count, autoPublish.topic)

            // 渲染日志
            renderLogs(logs)
          }
        } catch (err) {
          $('statusBadge').className = 'status-badge offline'
          $('statusText').textContent = '服务离线'
        }
      }

      fetchStatus()
      setInterval(fetchStatus, 1500)
    </script>
  </body>
</html>
